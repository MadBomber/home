# Book configuration for the Old Testament covenant study.
#
# Used by scripts/book/*.rb:  ruby scripts/book/build_draft.rb ot1y
# The book title comes from src/<slug>/index.md frontmatter, not from here.

slug: ot1y

# Eight covenants rather than six sections, and the weeks are distributed very
# unevenly across them (2, 2, 4, 8, 14, 14, 5, 3).
sections: 8
weeks: 52

week_page_breaks: false

title_page:
  # The site calls this study "A Year at His Feet — Old Testament". The book puts
  # the common title on one line and the distinguishing part below it, so `title`
  # is set explicitly here rather than inherited from index.md.
  title: "A Year at His Feet"
  subtitle: "Old Testament"

  # Same engraving, and the same width as the New Testament volume, so the two
  # books look like a set. See ntc1y.yml for why the crop is baked into the JPEG
  # rather than applied at build time.
  image: title-image.jpg
  image_width: 5.75in
  image_alt: >-
    Eighteenth-century French engraving: Christ seated at left teaching, Mary of
    Bethany seated on the floor at his feet looking up at him, Martha standing at
    right gesturing toward her work, four disciples behind.
  byline: "by Dewayne VanHoozer"

# --- prose fixes ---

# This study's prose already uses real em dashes; no spaced double hyphens exist
# (verified: 0 occurrences). Harmless to leave on, but off is honest.
fix_em_dashes: false

# No "Phase N" labels in this study (verified: 0 occurrences).
fix_phase_labels: false

# Week headings are already consistent across all 52 weeks
# (Overview / This Week's Readings / Key Themes / Christ in This Week).
heading_aliases: {}

section_page:
  # full -- these section pages are substantial: a body H1, an Overview, then
  # The Foundation, Key Old Testament Passages, Fulfilled in Christ, In Your
  # Study, Looking Ahead, The Personal Dimension. All of it is reader content
  # and is kept, demoted so it sits below the week headings.
  mode: full
  weeks_table: "Weeks in This Covenant"

  # Authoring notes, not reader content: a bullet list of topics still to be
  # developed ("deeper exploration of...", "tracing appearances of..."), present
  # in all 8 section pages. Dropped from the book.
  drop_headings:
    - "Content Expansion"
