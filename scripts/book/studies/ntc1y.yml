# Book configuration for the New Testament chronological study.
#
# Used by scripts/book/*.rb:  ruby scripts/book/build_draft.rb ntc1y
# The book title comes from src/<slug>/index.md frontmatter, not from here.

slug: ntc1y

# Expected counts. The build aborts if the sources do not match, which catches a
# half-finished week or a section added without its config.
sections: 6
weeks: 52

# Start every week on a fresh page? Measured cost when true: ~26 extra pages
# out of 115, because the page before each break is usually half empty.
week_page_breaks: false

title_page:
  # Both books share this title; the subtitle distinguishes them and prints on
  # the line below it. `title` defaults to the study's index.md frontmatter
  # title when omitted, which for this study is already what the book wants.
  subtitle: "New Testament"

  # Same artwork and size in both volumes, so the pair looks like a set.
  # title-image.jpg is already cropped to the plate (890x1190, aspect 1.337);
  # the engraved Latin caption below it is not in the file.
  #
  # Do NOT crop at build time instead. Setting cropBottom leaves the display box
  # at the uncropped aspect while showing only part of the source, which made
  # LibreOffice render the frame ~18% taller than the declared extent -- the
  # artwork overflowed the top margin and pushed the byline onto page 2.
  image: title-image.jpg
  # 5.75in is the largest that keeps title, subtitle, artwork and byline on
  # page 1; at 6in the byline spills onto page 2. Width is not the limit -- the
  # text block is 6.75in wide -- the page height is.
  image_width: 5.75in
  image_alt: >-
    Eighteenth-century French engraving: Christ seated at left teaching, Mary of
    Bethany seated on the floor at his feet looking up at him, Martha standing at
    right gesturing toward her work, four disciples behind.
  byline: "by Dewayne VanHoozer"

# --- prose fixes, all specific to how this study's text was authored ---

# This study writes em dashes as a spaced double hyphen (997 occurrences).
fix_em_dashes: true

# This study's prose calls sections "Phase N" in 3 places (leftover naming).
fix_phase_labels: true

# Inconsistent H2 wording across weeks; normalize to the majority variant.
heading_aliases:
  "## Big Picture": "## The Big Picture"
  "## Key Characters This Week": "## Key Characters"
  "## Daily Readings": "## This Week's Readings"
  "## Readings": "## This Week's Readings"

section_page:
  # overview_only -- the section index is essentially one essay under an
  # "## Overview" heading; keep that prose and drop the rest.
  mode: overview_only
  weeks_table: "Weeks in This Section"
