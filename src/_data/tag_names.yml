# What each topic tag is called in a language other than English.
#
# Tags are never translated in front matter: a Spanish essay carries the same
# `tags:` as its English original, and both languages share one tag page slug
# (/blog/tags/grace/ and /es/blog/tags/grace/). This file only supplies the
# name shown to the reader. A tag missing here is shown as written.
#
# Read by scripts/tags.rb (the generated tag pages) and by
# src/_partials/_topic_tags.erb (the topic line at the foot of an essay).
# After adding a tag to an essay, add its name here and rerun
#   ruby scripts/tags.rb src/blog
#
# Bible book names follow the NBLA. Books are capitalized; topics are not.

