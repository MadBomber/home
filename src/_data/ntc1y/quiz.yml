# Question pool for the warm-up quiz at /{study-slug}/quiz/ (rendered by
# _partials/_quiz.erb and quiz.js).
#
# Keyed by week number. The quiz at the start of week N draws randomly
# from the pools of weeks 1 through N-1, so questions are filed under
# the week whose reading they come from.
#
# Fields per question:
#   question — the prompt shown to the reader
#   choices  — four options; the renderer should shuffle them
#   answer   — the correct choice, repeated verbatim
#   ref      — the passage the answer comes from (shown on reveal)
#   day      — which day of the week that reading was
weeks:
  "1":
    - question: "John's Gospel opens by calling Jesus 'the ___'."
      choices:
        - "Lamb of God"
        - "Word"
        - "Good Shepherd"
        - "Son of David"
      answer: "Word"
      ref: "John 1:1"
      day: 1
    - question: "When Zechariah doubted the angel's promise of a son, what happened to him?"
      choices:
        - "He was struck blind"
        - "He was unable to speak until the baby was born"
