- slug: "ntc1y"
  hidden: false
  tagline: "A Year at His Feet"
  title: "New Testament Chronological Journey"
  title_es: "Recorrido cronológico por el Nuevo Testamento"
  tagline_es: "Un año a Sus pies"
  description_es: >-
    Un recorrido cronológico de 52 semanas por los 260 capítulos del Nuevo
    Testamento. Cada semana abarca un bloque coherente de las Escrituras, con
    lecturas diarias, contexto histórico, preguntas de reflexión y un versículo
    para memorizar.
  image: ""
  description: >-
    A 52-week chronological journey through all 260 chapters of the New Testament.
    Each week covers a coherent block of scripture with daily readings, historical
    context, reflection questions, and a memory verse.

- slug: "sotm"
  hidden: true
  tagline: "One Teaching, Two Witnesses"
  title: "The Sermon on the Mount and the Plain"
  title_es: "El Sermón del monte y el Sermón del llano"
  tagline_es: "Una enseñanza, dos testigos"
  description_es: >-
    Un estudio de seis semanas del Sermón del monte (Mateo 5-7) leído junto al
    Sermón del llano (Lucas 6:17-49): una sola enseñanza conservada por dos
    testigos. Cada semana toma un movimiento del sermón, con cinco lecturas
    diarias y una guía de discusión.
  image: ""
  description: >-
    A six-week study of the Sermon on the Mount (Matthew 5-7) read alongside the
    Sermon on the Plain (Luke 6:17-49), one teaching preserved by two
    witnesses. Each week takes one movement of the sermon with five daily
    readings and a discussion guide.

- slug: "ot1y"
