  not_found:
    title: Page Not Found
    badge: 404 — Page Not Found
    image_alt: The Good Shepherd seeking a lost sheep
    heading: Do you sometimes feel like a lost sheep?
    body: Wandering aimlessly, unsure of where you belong — Jesus is looking for you. He is the Good Shepherd. Trust in Him to bring you home where you belong.
    verse: '"For the Son of Man came to seek and to save the lost."'
    verse_ref: "— Luke 19:10 (ESV)"
    home: Return to Home
    path_heading: The Path Home
    path_intro: The Bible calls this feeling of being lost what it truly is — and shows the way back.
    steps:
      - text: We don't wander by accident. Scripture is clear that every one of us has turned away from God.
        verse: '"For all have sinned and fall short of the glory of God."'
        ref: "— Romans 3:23 (ESV)"
      - text: Sin carries a consequence — but God refuses to leave the story there.
        verse: '"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."'
        ref: "— Romans 6:23 (ESV)"
      - text: The Good Shepherd didn't wait for you to find your way back. He came looking — at great cost.
        verse: '"But God shows his love for us in that while we were still sinners, Christ died for us."'
        ref: "— Romans 5:8 (ESV)"
      - text: Coming home is simpler than you may think. It begins with a confession and a trust.
        verse: '"If you confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved."'
        ref: "— Romans 10:9 (ESV)"
      - text: And the promise is for everyone — no exceptions, no fine print.
        verse: '"For everyone who calls on the name of the Lord will be saved."'
        ref: "— Romans 10:13 (ESV)"
      - text: This is the heart of it all — the reason the Shepherd left the ninety-nine to find you.
        verse: '"For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life. For God did not send his Son into the world to condemn the world, but in order that the world might be saved through him."'
        ref: "— John 3:16–17 (ESV)"
  date:
    formats:
      # The essay pages and index cards. Bridgetown's own en.yml supplies the
      # month and day names; these two formats match what the site printed
      # before the strings were localized.
      long: "%B %-d, %Y"
      card: "%b %d, %y"
