  not_found:
    title: Página no encontrada
    badge: 404 — Página no encontrada
    image_alt: El Buen Pastor buscando a una oveja perdida
    heading: ¿A veces te sientes como una oveja perdida?
    body: Vagando sin rumbo, sin saber a dónde perteneces — Jesús te está buscando. Él es el Buen Pastor. Confía en Él para que te lleve a casa, a donde perteneces.
    # Scripture below is the NBLA, as printed.
    verse: "«Porque el Hijo del Hombre ha venido a buscar y a salvar lo que se había perdido»."
    verse_ref: "— Lucas 19:10 (NBLA)"
    home: Volver al inicio
    path_heading: El camino a casa
    path_intro: La Biblia llama por su nombre a esa sensación de estar perdido — y muestra el camino de regreso.
    steps:
      - text: "No nos extraviamos por accidente. La Escritura es clara: cada uno de nosotros se ha apartado de Dios."
        verse: "«Por cuanto todos pecaron y no alcanzan la gloria de Dios»."
        ref: "— Romanos 3:23 (NBLA)"
      - text: El pecado trae una consecuencia — pero Dios se niega a dejar la historia ahí.
        verse: "«Porque la paga del pecado es muerte, pero la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro»."
        ref: "— Romanos 6:23 (NBLA)"
      - text: El Buen Pastor no esperó a que encontraras el camino de regreso. Vino a buscarte — a un gran costo.
        verse: "«Pero Dios demuestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros»."
        ref: "— Romanos 5:8 (NBLA)"
      - text: Volver a casa es más sencillo de lo que piensas. Empieza con una confesión y con confiar.
        verse: "«Que si confiesas con tu boca a Jesús por Señor, y crees en tu corazón que Dios lo resucitó de entre los muertos, serás salvo»."
        ref: "— Romanos 10:9 (NBLA)"
      - text: Y la promesa es para todos — sin excepciones, sin letra pequeña.
        verse: "«Porque: “TODO AQUEL QUE INVOQUE EL NOMBRE DEL SEÑOR SERÁ SALVO”»."
        ref: "— Romanos 10:13 (NBLA)"
      - text: Este es el corazón de todo — la razón por la que el Pastor dejó las noventa y nueve para encontrarte.
        verse: "«Porque de tal manera amó Dios al mundo, que dio a Su Hijo unigénito, para que todo aquel que cree en Él, no se pierda, sino que tenga vida eterna. Porque Dios no envió a Su Hijo al mundo para juzgar al mundo, sino para que el mundo sea salvo por Él»."
        ref: "— Juan 3:16–17 (NBLA)"
