    verse_1: "«Toda Escritura es inspirada por Dios y útil para enseñar, para reprender, para corregir, para instruir en justicia, a fin de que el hombre de Dios sea perfecto, equipado para toda buena obra»."
    verse_1_ref: "— 2 Timoteo 3:16–17 (NBLA)"
